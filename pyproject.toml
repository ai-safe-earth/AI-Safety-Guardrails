[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
# Single entry point. `aisg <command> --help` shows each tool's own options.
#   aisg lint src/
#   aisg lint src/ --format sarif --output results.sarif
#   aisg misalign src/ --fail-on-warnings
aisg = "aisg.cli:main"
# Retained so existing pre-commit configs and CI keep working.
euaiact-lint = "aisg.devtools.euaiact_lint:main"
misalignment-check = "aisg.devtools.misalignment_check:main"

[project]
name = "ai-safety-guardrails"
version = "0.1.0"
description = "Production-ready, modular AI safety guardrails for any LLM pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

keywords = ["AI safety", "guardrails", "LLM", "EU AI Act", "prompt injection", "PII"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# PII detection (Presidio)
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]

# LangChain integration
langchain = [
    "langchain>=0.3",
    "langchain-core>=0.3",
]

# FastAPI integration
fastapi = [
    "fastapi>=0.110",
    "starlette>=0.37",
]

# Anthropic integration
anthropic = [
    "anthropic>=0.40",
]

# LlamaGuard 3 via Groq, Together, Ollama or OpenAI needs nothing beyond the
# core aiohttp dependency. Listed for discoverability.
llamaguard = []

# Local LlamaGuard inference through transformers. ~2GB of wheels for one of
# five providers, so it is deliberately not part of `llamaguard` or `all` --
# installing the judge should not drag in torch.
llamaguard-local = [
    "transformers>=4.40",
    "torch>=2.2",
    "accelerate>=0.30",
]

# OpenAI Moderation API judge (uses only aiohttp — no extra packages needed)
# Listed here for discoverability; no actual extra deps required.
openai-mod = []

# Settings / .env file support
settings = [
    "pydantic-settings>=2.0",
]

# Claude judge (uses anthropic SDK)
claude-judge = [
    "anthropic>=0.40",
]

# All LLM judges
llm-judges = [
    "ai-safety-guardrails[anthropic]",
]

# NVIDIA NeMo Guardrails integration
nemo = [
    "nemoguardrails>=0.9",
]

# OpenTelemetry observability
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]

# Prometheus metrics
metrics = [
    "prometheus-client>=0.20",
]

# Static analysis CLI (`aisg lint` / `aisg misalign`) -- deliberately light.
# The analysers are pure-stdlib AST walkers; they need nothing beyond the base
# dependencies. tomli only backfills tomllib on Python 3.10 so the CLI can read
# its [tool.*] defaults out of pyproject.toml.
devtools = [
    "tomli>=2.0; python_version < '3.11'",
]

# Deprecated alias for `devtools`.
lint = [
    "ai-safety-guardrails[devtools]",
]

# Pre-commit companion tools
precommit = [
    "pre-commit>=3.7",
    "detect-secrets>=1.4",
]

# Full install (everything)
all = [
    "ai-safety-guardrails[presidio,langchain,fastapi,anthropic,otel,metrics,devtools,precommit,llm-judges,settings,nemo]",
]

# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",          # FastAPI middleware tests
    "pre-commit>=3.7",      # Local hook testing
    "detect-secrets>=1.4",  # Secret scanning companion
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aisg*"]

[tool.setuptools.package-data]
# YAML presets ship inside the wheel; readable via aisg.config.preset_path().
"aisg.config" = ["*.yaml", "nemo_rails/*"]
# Attack corpus for `aisg probe`, loaded via importlib.resources.
"aisg.probes" = ["*.yaml"]
# Agent skill copied by `aisg skill install`, read via aisg.skills.skill_root().
# The recursive glob is the intent; the per-type globs cover setuptools
# versions that do not recurse `**`.
"aisg.skills" = [
    "ai-safety-audit/**/*",
    "ai-safety-audit/SKILL.md",
    "ai-safety-audit/**/*.md",
    "ai-safety-audit/**/*.yaml",
    "ai-safety-audit/**/*.sh",
    "ai-safety-audit/**/*.ps1",
]
# Semgrep taint rules for the `aisg audit` semgrep adapter.
"aisg.devtools.audit" = ["semgrep/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Deliberately-broken linter input; mypy excludes it too.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# examples/ call sys.path.insert to run against src/ without installing.
# tests/ stub optional dependencies into sys.modules before importing the code
# under test, so those imports must follow the stub.
"tests/*" = ["E402"]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tests/fixtures/"]   # fixtures contain intentionally bad code

# -------------------------------------------------------
# euaiact-lint configuration
# -------------------------------------------------------
# Read by aisg/devtools/euaiact_lint.py via aisg/devtools/_config.py
# when invoked with no explicit flags.
[tool.euaiact-lint]
paths = ["src", "examples"]
exclude = ["tests/fixtures", "__pycache__", ".venv", "dist"]
format = "terminal"
errors_only = false         # set true to only report Art.5 / security errors
fail_on_warnings = false    # set true for strict CI enforcement

# -------------------------------------------------------
# misalignment-check configuration
# -------------------------------------------------------
# Read by aisg/devtools/misalignment_check.py via aisg/devtools/_config.py
# when invoked with no explicit flags.
[tool.misalignment-check]
paths = ["src", "examples"]
exclude = ["tests/fixtures", "__pycache__", ".venv", "dist"]
format = "terminal"
errors_only = false         # set true to hard-block on ALIGN-001/005/006/008 only
fail_on_warnings = false    # set true for strict PR enforcement
