# config/default.yaml
# -------------------------------------------------------
# AI Safety Guardrails — Default Pipeline Configuration
# -------------------------------------------------------
# All modules are optional. Set enabled: false to skip any.
# Override per environment: production.yaml, eu_high_risk.yaml, etc.

pipeline:
  mode: async
  parallel_checks: true        # Run input checks in parallel for lower latency
  fail_open: false             # If true, guardrail errors allow traffic through (NOT recommended for prod)
  request_timeout: 30.0        # Max seconds for the LLM call in run_full() (0 = no timeout)

# ⑤ OBSERVABILITY (OpenTelemetry)
# Install:  pip install "aisguard[otel]"
# Pass a TelemetryProvider instance to GuardrailPipeline(telemetry_provider=...).
# Backends: set exporter to "otlp" and point otlp_endpoint at any OTLP collector
# (Jaeger, Zipkin, Datadog, Honeycomb, Grafana Tempo, AWS X-Ray via ADOT, etc.)
#
# observability:
#   enabled: true
#   service_name: my-ai-system
#   exporter: console              # "console" | "otlp" | "none"
#   otlp_endpoint: http://localhost:4317
#   otlp_protocol: grpc            # "grpc" | "http"
#   metric_export_interval_ms: 60000

# ① INPUT GUARDRAILS
input:
  pii_detector:
    enabled: true
    action: redact             # redact | block | flag
    entities:
      - EMAIL
      - PHONE_US
      - PHONE_INTL
      - SSN
      - CREDIT_CARD
      - IP_ADDRESS
    use_presidio: false        # Set true if presidio-analyzer is installed

  prompt_injection:
    enabled: true
    sensitivity: medium        # low | medium | high
    check_base64: true
    llm_judge: false           # Enable for high-security deployments (+latency)
    log_attempts: true

  topic_classifier:
    enabled: false             # Enable and configure allowed_topics for your use case
    # allowed_topics:
    #   - customer_support
    #   - billing
    #   - product_info
    # fallback_message: "I can only help with customer support, billing, and product topics."

  toxicity_input:
    enabled: false
    # threshold: 0.8
    # categories: [self_harm_promotion, violent_threats, dangerous_instructions]

  rate_limiter:
    enabled: true
    requests_per_minute: 60
    tokens_per_day: 100000
    key_field: user_id         # context field to key limits on
    count_tokens: true

# ② PROCESSING GUARDRAILS (tool use / agent control)
processing:
  tool_policy:
    enabled: true
    default_deny: true
    default_role: user
    approval_timeout: 30.0         # Seconds to wait for approval callback before denying
    max_tool_calls_per_session: 0  # 0 = unlimited; set e.g. 50 to cap agentic loops
    max_calls_per_tool: 0          # 0 = unlimited per-tool cap
    # require_approval:
    #   - send_email
    #   - database_write
    #   - payment_*
    # policies:
    #   user:
    #     allow: [search, calculator, fetch_url, read_file]
    #     deny: [file_write, exec_code, shell_command]
    #     argument_rules:           # Argument-level constraints per tool
    #       read_file:
    #         path: "./data/*"      # Only allow reads inside ./data/
    #       fetch_url:
    #         url: "https://*.trusted-domain.com/*"
    #   admin:
    #     allow: ["*"]
    #     deny: [shell_command]

  context_control:
    enabled: false             # Not yet implemented
    # max_rag_results: 5
    # allowed_collections: [public_docs, kb_articles]

  memory_hygiene:
    enabled: false             # Not yet implemented
    # ttl_seconds: 3600
    # max_memory_tokens: 4096

# ③ OUTPUT GUARDRAILS
output:
  toxicity_output:
    enabled: true
    threshold: 0.7
    action: block              # block | warn | flag
    categories:
      - self_harm_promotion
      - violent_threats
      - dangerous_instructions
    use_llm_judge: false       # Enable for higher accuracy (+latency)

  pii_restorer:
    enabled: false             # Enable when using PIIDetector(action="tokenize") on input
    # Restores <PII:TYPE:N> tokens to original values after LLM response

  hallucination:
    enabled: false             # Not yet implemented
    # threshold: 0.6
    # citation_required: false

  schema_validator:
    enabled: false             # Not yet implemented
    # schema: {}
    # strict: false

  content_policy:
    enabled: false             # Not yet implemented
    # rules: []

# ④ POLICY COMPLIANCE
policy:
  eu_ai_act:
    enabled: true
    risk_tier: limited         # unacceptable | high | limited | minimal
    system_id: my-ai-system
    provider_name: My Organization
    enable_audit_log: false    # Set true for high-risk tier
    audit_log_path: audit/eu_ai_act.jsonl
    audit_retention_days: 365
    check_prohibited: true
    check_high_risk_indicators: true
    strict_mode: true

  gdpr:
    enabled: false
    # data_minimization: true
    # purpose_limitation: true
