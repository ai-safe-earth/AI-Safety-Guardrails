# aisg/devtools/audit/semgrep/aisg-sinks.yaml
# ---------------------------------------------
# Taint rules for `aisg audit`: model output flowing into a dangerous sink.
#
# Sources are the expressions that return an LLM response (OpenAI / Anthropic / Gemini /
# LangChain / Vercel AI SDK / Ollama) and the accessors that pull text out of one.
# Sinks are the P4 table from the audit design: shell, eval, sql, html, url, fs.
# Rules are split per language because every pattern in a rule must parse in every
# language the rule lists.
#
# Metadata contract (read by adapters.py -> SemgrepAdapter):
#   aisg_rule / aisg_rule_id : the AUD id the finding is folded into
#   kind                     : sink kind, also resolvable through SINK_RULE_BY_KIND
#
# Run by the adapter as:
#   semgrep scan --config <this file> --json --metrics=off --quiet --timeout 30 .

rules:
  # ---------------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------------
  - id: aisg-sink-shell-python
    message: Model output reaches a shell command
    severity: ERROR
    languages: [python]
    mode: taint
    metadata:
      aisg_rule: AUD-401
      aisg_rule_id: AUD-401
      kind: shell
      category: security
    pattern-sources:
      - pattern-either:
          - pattern: $CLIENT.chat.completions.create(...)
          - pattern: $CLIENT.messages.create(...)
          - pattern: $CLIENT.responses.create(...)
          - pattern: $MODEL.generate_content(...)
          - pattern: $CHAIN.invoke(...)
          - pattern: $CHAIN.invoke(...).content
          - pattern: ollama.chat(...)
          - pattern: $RESP.choices[0].message.content
          - pattern: $RESP.content[0].text
          - pattern: $RESP.output_text
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.$F(...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: os.execv(...)
          - pattern: os.execvp(...)
          - pattern: asyncio.create_subprocess_shell(...)

  - id: aisg-sink-eval-python
    message: Model output is evaluated as code
    severity: ERROR
    languages: [python]
    mode: taint
    metadata:
      aisg_rule: AUD-402
      aisg_rule_id: AUD-402
      kind: eval
      category: security
    pattern-sources:
      - pattern-either:
          - pattern: $CLIENT.chat.completions.create(...)
          - pattern: $CLIENT.messages.create(...)
          - pattern: $CLIENT.responses.create(...)
          - pattern: $MODEL.generate_content(...)
          - pattern: $CHAIN.invoke(...)
          - pattern: $CHAIN.invoke(...).content
          - pattern: ollama.chat(...)
          - pattern: $RESP.choices[0].message.content
          - pattern: $RESP.content[0].text
          - pattern: $RESP.output_text
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: compile(...)
          - pattern: __import__(...)
          - pattern: importlib.import_module(...)

  - id: aisg-sink-sql-python
    message: Model output reaches a SQL statement
    severity: ERROR
    languages: [python]
    mode: taint
    metadata:
      aisg_rule: AUD-403
      aisg_rule_id: AUD-403
