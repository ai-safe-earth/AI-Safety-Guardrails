          - pattern: $CHAIN.invoke(...).content
          - pattern: ollama.chat(...)
          - pattern: $RESP.choices[0].message.content
          - pattern: $RESP.content[0].text
          - pattern: $RESP.output_text
    pattern-sinks:
      - pattern-either:
          - pattern: Markup(...)
          - pattern: markupsafe.Markup(...)
          - pattern: mark_safe(...)
          - pattern: render_template_string(...)
          - pattern: HTMLResponse(...)
          - pattern: $ST.markdown(..., unsafe_allow_html=True)
          - pattern: $ST.html(...)

  - id: aisg-sink-url-python
