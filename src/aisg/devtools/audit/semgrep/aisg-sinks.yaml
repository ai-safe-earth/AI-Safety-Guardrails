          - pattern: $CLIENT.responses.create(...)
          - pattern: $MODEL.generate_content(...)
          - pattern: $CHAIN.invoke(...)
          - pattern: $CHAIN.invoke(...).content
          - pattern: ollama.chat(...)
          - pattern: $RESP.choices[0].message.content
          - pattern: $RESP.content[0].text
          - pattern: $RESP.output_text
    pattern-sinks:
      - pattern-either:
          - pattern: $CURSOR.execute(...)
          - pattern: $CURSOR.executemany(...)
          - pattern: $CURSOR.executescript(...)
          - pattern: $DB.raw(...)
          - pattern: text(...)
          - pattern: sqlalchemy.text(...)

  - id: aisg-sink-html-python
    message: Model output is rendered as HTML without escaping
    severity: WARNING
    languages: [python]
    mode: taint
    metadata:
