          - pattern: $RESP.content[0].text
          - pattern: $RESP.output_text
    pattern-sinks:
      - pattern-either:
          - pattern: open(...)
          - pattern: Path(...)
          - pattern: $P.write_text(...)
          - pattern: $P.write_bytes(...)
          - pattern: $P.unlink(...)
          - pattern: shutil.$F(...)
