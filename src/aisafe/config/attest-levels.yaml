# attest-levels.yaml
# ---------------------------------------------------------------------------
# The criteria `aisafe attest` evaluates. A level is reached when every criterion of
# that level and of every level below it is met. The level is a list of criteria met
# on a date, signed by a named owner; it is not a compliance verdict, and no renderer
# calls it one.
#
# Shipped in the wheel (src/aisafe/config/) and mirrored at config/; the two are kept
# identical by a test. `--level-criteria PATH` points `aisafe attest` at another file.
#
# Criterion kinds (attest.CRITERION_KINDS):
#   report_present(max_age_days)          an audit report, fresh enough
#   report_names_head                     report.target.git_sha equals HEAD
#   unknown_listed                        the report carries its UNKNOWN list
#   no_open_findings_at_or_above(severity) every finding at or above it has an accepted reason
#   external_tools_attempted              no external scanner skipped by --no-external
#   accepted_reasons_present              every baseline fingerprint carries a reason
#   document_present(document, max_age_days)  a measure | probe | decision document, fresh
#   measure_thresholds                    no guard over a declared threshold, none unavailable
#   probe_passing_if_present              failed == 0 and errors == 0 when a probe report exists
#   rules_closed(rules)                   no open finding of those rules
#   card_fields_set(fields)               the system card's listed fields are not placeholders
#   card_section_fresh(section, fields, date_field, max_age_days)  a card block set, recently dated
#   accepted_risks_owned                  every accepted risk is written next to the owner
#   tree_clean                            no uncommitted changes (governed = reproducible)
# ---------------------------------------------------------------------------
schema: aisg/1
kind: attest-levels
review_interval_days: 90
levels:
  - level: 0
    name: audited
    criteria:
      - {id: L0.report, kind: report_present, max_age_days: 30}
      - {id: L0.commit, kind: report_names_head}
      - {id: L0.unknown, kind: unknown_listed}
  - level: 1
    name: triaged
    criteria:
      - {id: L1.no_open_high, kind: no_open_findings_at_or_above, severity: high}
      - {id: L1.scanners, kind: external_tools_attempted}
      - {id: L1.reasons, kind: accepted_reasons_present}
  - level: 2
    name: measured
    criteria:
      - {id: L2.measure, kind: document_present, document: measure, max_age_days: 30}
      - {id: L2.thresholds, kind: measure_thresholds}
      - {id: L2.probe, kind: probe_passing_if_present}
      - {id: L2.decision, kind: document_present, document: decision, max_age_days: 30}
      - {id: L2.evals_ci, kind: rules_closed, rules: [AUD-901, AUD-903]}
  - level: 3
    name: governed
    criteria:
      - {id: L3.card, kind: card_fields_set, fields: [system.purpose, affected_persons, incident_contact, risk_tier, deployment]}
      - {id: L3.prompt_audit, kind: card_section_fresh, section: prompt_audit, fields: [reviewed_at, reviewer], date_field: reviewed_at, max_age_days: 180}
      - {id: L3.controls, kind: rules_closed, rules: [AUD-107, AUD-701, AUD-702, AUD-703, AUD-1107]}
      - {id: L3.owner, kind: accepted_risks_owned}
      - {id: L3.tree, kind: tree_clean}
