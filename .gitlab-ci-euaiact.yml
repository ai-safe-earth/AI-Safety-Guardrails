# .gitlab-ci-euaiact.yml
# -------------------------------------------------------
# EU AI Act Compliance — GitLab CI/CD
# -------------------------------------------------------
# Include in your main .gitlab-ci.yml:
#   include:
#     - local: '.gitlab-ci-euaiact.yml'
#
# Or merge the stages/jobs into your existing pipeline.

stages:
  - compliance

variables:
  SCAN_PATH: "."
  FAIL_ON_WARNINGS: "false"

# ── Full scan (all pushes to main/develop) ───────────────────────────────

eu-ai-act-full-scan:
  stage: compliance
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Manual trigger
  before_script:
    - pip install pyyaml --quiet
  script:
    - |
      echo "🔍 Running EU AI Act compliance scan..."
      aisg lint $SCAN_PATH \
        --format terminal \
        --no-color \
        $([ "$FAIL_ON_WARNINGS" = "true" ] && echo "--fail-on-warnings" || echo "")
    - |
      # Generate artifacts
      aisg lint $SCAN_PATH --format json --output eu-ai-act-report.json
      aisg lint $SCAN_PATH --format sarif --output eu-ai-act-results.sarif
  artifacts:
    name: "eu-ai-act-compliance-$CI_COMMIT_SHORT_SHA"
    paths:
      - eu-ai-act-report.json
      - eu-ai-act-results.sarif
    reports:
      sast: eu-ai-act-results.sarif   # Shows in GitLab Security Dashboard
    expire_in: 90 days                # Art. 12 retention
    when: always
  allow_failure: false                # Block pipeline on errors

# ── Diff-only scan (Merge Requests) ──────────────────────────────────────

eu-ai-act-mr-scan:
  stage: compliance
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - pip install pyyaml --quiet
    - apt-get update -qq && apt-get install -y -qq git 2>/dev/null
  script:
    - |
      echo "🔍 EU AI Act — scanning changed files in MR..."
      
      # Get changed Python files in this MR
      git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD \
        | grep '\.py$' > changed_files.txt || true
      
      if [ ! -s changed_files.txt ]; then
        echo "No Python files changed. Skipping."
        exit 0
      fi
      
      echo "Changed files:"
      cat changed_files.txt
      
      # Scan each changed file
      EXIT_CODE=0
      while IFS= read -r file; do
        if [ -f "$file" ]; then
          aisg lint "$file" \
            --errors-only \
            --no-color || EXIT_CODE=1
        fi
      done < changed_files.txt
      
      exit $EXIT_CODE
  allow_failure: false

# ── Scheduled weekly audit ────────────────────────────────────────────────
# Add to your project's CI/CD Schedules:
#   Description: "EU AI Act Weekly Audit"
#   Cron: "0 9 * * 1"  (every Monday 9 AM)

eu-ai-act-weekly-audit:
  stage: compliance
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - pip install pyyaml --quiet
  script:
    - aisg lint . --format json --output weekly-audit.json
    - aisg lint . --format terminal --no-color --fail-on-warnings
  artifacts:
    name: "eu-ai-act-weekly-audit-$CI_COMMIT_SHORT_SHA"
    paths:
      - weekly-audit.json
    expire_in: 365 days
    when: always
  allow_failure: true   # Weekly audit is informational; does not block
