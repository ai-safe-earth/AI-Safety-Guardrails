# config/eu_high_risk.yaml
# -------------------------------------------------------
# EU AI Act — HIGH RISK System Configuration
# -------------------------------------------------------
# Use this config for AI systems classified as HIGH RISK
# under Regulation (EU) 2024/1689, Annex III.
#
# High-risk rules enter into force: 2 August 2026
# (extended transition for regulated products: 2 August 2027)
#
# This preset enforces:
#   Art. 5  — Prohibited practices (hard block)
#   Art. 9  — Risk management hooks
#   Art. 12 — Automatic logging with tamper-evident audit trail
#   Art. 13 — Transparency disclosure in all outputs
#   Art. 14 — Human oversight gate (configurable threshold)
#   Art. 15 — Accuracy & robustness tracking via metrics

pipeline:
  mode: async
  parallel_checks: false       # Sequential for high-risk (ensures full chain logging)
  fail_open: false             # NEVER fail open in high-risk deployments

input:
  pii_detector:
    enabled: true
    action: block              # Hard block PII in inputs for high-risk systems
    entities:
      - EMAIL
      - PHONE_US
      - PHONE_INTL
      - SSN
      - CREDIT_CARD
      - IBAN
      - PASSPORT
      - IP_ADDRESS
      - DATE_OF_BIRTH
      - EU_TAX_ID
    use_presidio: true         # Use Presidio for richer detection

  prompt_injection:
    enabled: true
    sensitivity: high
    check_base64: true
    llm_judge: true            # Secondary LLM judge for high-risk

  topic_classifier:
    enabled: true
    # Configure allowed_topics per your system's intended purpose (Art. 13)

  toxicity_input:
    enabled: true
    threshold: 0.5             # Lower threshold = more strict

  rate_limiter:
    enabled: true
    requests_per_minute: 30
    tokens_per_day: 50000

processing:
  tool_policy:
    enabled: true
    default_deny: true
    require_approval:
      - send_email
      - database_write
      - database_delete
      - payment_*
      - exec_code
      - shell_command
      - deploy
      - file_delete

  context_control:
    enabled: true
    max_rag_results: 3         # Data minimization principle

  memory_hygiene:
    enabled: true
    ttl_seconds: 1800          # 30 min session memory limit
    max_memory_tokens: 2048

output:
  toxicity_output:
    enabled: true
    threshold: 0.5
    action: block
    use_llm_judge: true

  pii_redactor:
    enabled: true
    entities:
      - EMAIL
      - PHONE_US
      - PHONE_INTL
      - SSN
      - CREDIT_CARD
      - IBAN
      - IP_ADDRESS
      - PASSPORT

  hallucination:
    enabled: true
    threshold: 0.5
    citation_required: true

  content_policy:
    enabled: true

policy:
  eu_ai_act:
    enabled: true
    risk_tier: high
    system_id: REPLACE_WITH_YOUR_SYSTEM_ID
    provider_name: REPLACE_WITH_YOUR_ORGANIZATION
    enable_audit_log: true     # MANDATORY for high-risk (Art. 12)
    audit_log_path: audit/eu_ai_act_high_risk.jsonl
    audit_retention_days: 730  # 2 years recommended for high-risk
    check_prohibited: true
    check_high_risk_indicators: true
    strict_mode: true
    transparency_disclosure: |
      [AI SYSTEM NOTICE: This response was generated by an AI system. 
       Provider: {provider_name}. System ID: {system_id}.
       This system is subject to EU AI Act (Regulation 2024/1689) compliance obligations.]

  gdpr:
    enabled: true
    data_minimization: true
    purpose_limitation: true
    retention_policy_days: 90
