# bench/corpus.yaml
# ---------------------------------------------------------------------
# Benchmark corpus for measuring euaiact-lint rule precision.
#
# 20 public repositories that make LLM calls, spanning agent frameworks,
# RAG stacks, prompting libraries, gateways and chat UIs. Each is pinned to
# an exact commit so a precision number stays reproducible: re-running the
# harness months later scans byte-identical source.
#
# SHAs resolved from each repo's default branch HEAD on 2026-09-01 via
# `git ls-remote`. They are recorded verbatim -- to refresh the corpus,
# re-run that command and update `sha`, do not edit by hand.
#
# `branch` is recorded for provenance only. The harness fetches `sha`.
# ---------------------------------------------------------------------

corpus_resolved: 2026-09-01
