# .github/workflows/tests.yml
# ---------------------------------------------------------------------------
# The test and lint gate.
#
# eu-ai-act-compliance.yml runs only the compliance linter, so until this
# existed the test suite guarded nothing on push. The suite is fully mocked --
# no API keys, no network -- so it runs anywhere.
# ---------------------------------------------------------------------------

name: Tests

on:
  pull_request:
    branches: [main, develop, "release/**"]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of requires-python = ">=3.10".
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          # Tool installs in this file are pinned to exact versions: the
          # self-audit below (AUD-602) flags an unpinned bootstrap, and this
          # workflow should not need a baseline entry for itself.
          python -m pip install pip==26.1.2
          # Editable install proves the packaging works, not just the source tree.
          # settings/otel/metrics are included because the suite covers them --
          # without them those tests skip, and a silent skip is not a pass.
          pip install -e ".[dev,devtools,settings,otel,metrics]"

      - name: Optional deps really are installed
        # These tests skip themselves when their extra is missing. A silent skip
        # would look like a pass, so assert the extras are present before running.
        run: |
          python -c "
          import importlib.util, sys
          missing = [m for m in ('pydantic_settings', 'opentelemetry')
                     if importlib.util.find_spec(m) is None]
          sys.exit(f'optional deps missing, tests would silently skip: {missing}') if missing else None
          print('optional deps present')
          "

      - name: Run tests
        run: pytest -q

      - name: Confirm the suite needs no API keys
        # A test that quietly starts depending on a real provider would pass
        # locally and fail for everyone else. Fail loudly instead.
        env:
          GROQ_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
        run: pytest -q

  audit:
    name: aisg audit gate
    # Runs after the matrix test job. Everything here exercises the built
    # wheel, not the source tree: the console script, the packaged skill and
    # the audit's own package data have to work from the artifact alone.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build the wheel
        run: |
          pip install build==1.2.2.post1
          python -m build --wheel

      - name: Install the wheel into a fresh venv
        # Not an editable install. The venv's bin/ goes first on PATH so that
        # `aisg` and `python` in the later steps are the installed wheel's.
        run: |
          python -m venv "$RUNNER_TEMP/aisg-venv"
          "$RUNNER_TEMP/aisg-venv/bin/pip" install dist/*.whl
          echo "$RUNNER_TEMP/aisg-venv/bin" >> "$GITHUB_PATH"

      - name: Skill ships in the wheel
        # From a neutral directory so the import cannot fall back to src/.
        run: |
          cd "$RUNNER_TEMP"
          python -c "from aisg.skills import skill_root; assert (skill_root()/'SKILL.md').exists()"

      - name: Fixture exit codes
        # [tool.aisg-audit] in pyproject.toml is resolved from the CURRENT
        # DIRECTORY, not from the audited path, and ours sets fail-on = "high"
        # plus an exclude list for the self-audit. These runs therefore cd
        # into a temporary directory (chosen over passing --fail-on low so
        # that the exclude list is not inherited either) and see the plain
        # defaults: fail-on = low, nothing excluded. Exit codes are captured
        # through `|| rc=$?` and compared exactly: a fatal 2 must not pass as
        # "non-zero, as expected".
        run: |
          set -eu
          fixtures="$GITHUB_WORKSPACE/tests/fixtures/audit"
          cd "$(mktemp -d)"

          # py_agent: trifecta, uncapped loop, ungated tools -> findings -> 1.
          rc=0; aisg audit "$fixtures/py_agent" --no-external --format json -o /dev/null || rc=$?
          test "$rc" -eq 1

          # clean_py: no finding, but --no-external leaves UNKNOWN items for
          # the skipped scanners; --fail-on-unknown turns those into exit 1 ...
          rc=0; aisg audit "$fixtures/clean_py" --fail-on-unknown --no-external || rc=$?
          test "$rc" -eq 1

          # ... and without it the same tree exits 0.
          rc=0; aisg audit "$fixtures/clean_py" --no-external || rc=$?
          test "$rc" -eq 0

      - name: Self-audit against the baseline
        # From the repo root on purpose: here [tool.aisg-audit] supplies the
        # exclude list (tests/ and the probe corpus hold fake keys and
        # injection text the rules must catch elsewhere) and fail-on = high.
        # Exit 0 means no NEW finding at high or above. Every accepted finding
        # sits in audit-baseline.json with a reason; the terminal summary line
        # `baseline: N new, ...` says how many are not in it.
        #
        # The baseline file is scanned too (it is not excluded), so a reason
        # there must describe the evidence without quoting the literal that
        # produced it; tests/unit/test_audit_baseline.py pins that. To accept
        # a finding: re-run with --format json, add its fingerprint to both
        # lists with a reason, never a bare fingerprint.
        run: |
          rc=0; aisg audit . --no-external --fail-on high --baseline audit-baseline.json || rc=$?
          test "$rc" -eq 0

      - name: Skill mirrors match the packaged skill
        # .claude/skills and .agents/skills are byte-identical copies of the
        # packaged skill; exit 1 lists the drifted files.
        run: |
          rc=0; aisg skill diff --host all || rc=$?
          test "$rc" -eq 0

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff==0.11.2
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  measure:
    name: guards stay inside their budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[devtools]"

      - name: Measure the default pipeline
        # The ratchet. `aisg measure` exits 1 when any guard breaches a
        # threshold, so a guard that starts over-blocking or slows down fails
        # the build instead of quietly degrading. Detection-only testing cannot
        # catch either -- "block everything" passes an attack corpus perfectly.
        run: aisg measure --max-p99-ms 25

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-report
          path: measure-report.json
          retention-days: 90

  build:
    name: wheel builds and exposes only `aisg`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build==1.2.2.post1
      - run: python -m build --wheel
      - name: No top-level name collisions
        # The whole point of the src/aisg layout: a published wheel must not
        # claim `core`, `modules`, `config` or any other common name.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          top = {n.split("/")[0] for n in zipfile.ZipFile(whl).namelist()}
          pkgs = {t for t in top if not t.endswith(".dist-info")}
          print("top-level in wheel:", sorted(pkgs))
          if pkgs != {"aisg"}:
              sys.exit(f"wheel exposes more than `aisg`: {sorted(pkgs)}")
          PY

      - name: Packaged config presets are readable from the wheel
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "
          from aisg.config import preset_path
          from aisg.core.pipeline import GuardrailPipeline
          p = preset_path('default.yaml')
          assert p.is_file(), p
          GuardrailPipeline.from_config(p)
          print('packaged presets OK:', p.name)
          "

      - name: Probe corpus loads from the wheel
        run: |
          cd /tmp
          python -c "
          from aisg.devtools.probe import load_corpus, available_families
          cases = load_corpus(system_canary='CI-CANARY')
          assert len(cases) >= 40, len(cases)
          assert len(available_families()) == 6
          print(f'{len(cases)} probe cases across {len(available_families())} families')
          "
