# .github/workflows/eu-ai-act-compliance.yml
# -------------------------------------------------------
# EU AI Act Compliance Check — GitHub Actions
# -------------------------------------------------------
# Triggers on:
#   - Pull requests (blocks merge if errors found)
#   - Push to main/develop
#   - Manual dispatch (run on any branch)
#   - Weekly scheduled scan (full repo audit)
#
# Outputs:
#   - Terminal summary in CI logs
#   - SARIF uploaded to GitHub Code Scanning (Security tab)
#   - JSON artifact for downstream processing
#   - PR comment with Markdown summary (on PRs)

name: EU AI Act Compliance

on:
  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "**/*.py"
      - ".github/workflows/eu-ai-act-compliance.yml"

  push:
    branches: [main, develop]
    paths:
      - "**/*.py"

  schedule:
    # Weekly full audit — every Monday 09:00 UTC
    - cron: "0 9 * * 1"

  workflow_dispatch:
    inputs:
      scan_path:
        description: "Directory to scan (default: .)"
        required: false
        default: "."
      fail_on_warnings:
        description: "Fail on warnings (not just errors)"
        type: boolean
        default: false

jobs:
  eu-ai-act-lint:
    name: EU AI Act Compliance Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # Required for SARIF upload
      pull-requests: write      # Required for PR comments
      contents: read

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Full history for diff-based scanning

      # ── Python setup ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pyyaml
          # Install the guardrails package in editable mode
          pip install -e . --no-deps 2>/dev/null || true

      # ── Determine scan scope ────────────────────────────────────────────
      - name: Set scan path
        id: scan-path
        run: |
          SCAN_PATH="${{ github.event.inputs.scan_path || '.' }}"
          echo "path=$SCAN_PATH" >> $GITHUB_OUTPUT

      # ── Run compliance scan ─────────────────────────────────────────────
      - name: Run EU AI Act compliance scan (terminal)
        id: lint-terminal
        run: |
          aisg lint "${{ steps.scan-path.outputs.path }}" \
            --format terminal \
            --no-color \
            ${{ github.event.inputs.fail_on_warnings == 'true' && '--fail-on-warnings' || '' }}
        continue-on-error: true   # We handle exit code manually below

      # ── JSON report ─────────────────────────────────────────────────────
      - name: Generate JSON report
        run: |
          aisg lint "${{ steps.scan-path.outputs.path }}" \
            --format json \
            --output eu-ai-act-report.json

      - name: Upload JSON report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eu-ai-act-compliance-report
          path: eu-ai-act-report.json
          retention-days: 90    # Art. 12 — retain for audit purposes

      # ── SARIF report (GitHub Code Scanning) ─────────────────────────────
      - name: Generate SARIF report
        run: |
          aisg lint "${{ steps.scan-path.outputs.path }}" \
            --format sarif \
            --output eu-ai-act-results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: eu-ai-act-results.sarif
          category: eu-ai-act-compliance

      # ── Markdown PR comment ─────────────────────────────────────────────
      - name: Generate Markdown summary
        if: github.event_name == 'pull_request'
        run: |
          aisg lint "${{ steps.scan-path.outputs.path }}" \
            --format markdown \
            --output eu-ai-act-summary.md

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eu-ai-act-compliance
          path: eu-ai-act-summary.md

      # ── Check results & set job status ──────────────────────────────────
      - name: Check compliance results
        run: |
          python - <<'EOF'
          import json, sys

          with open("eu-ai-act-report.json") as f:
              report = json.load(f)

          errors   = report["summary"]["errors"]
          warnings = report["summary"]["warnings"]
          total    = report["summary"]["total_findings"]
          files    = report["summary"]["files_scanned"]

          print(f"Scanned {files} files — {total} findings: {errors} error(s), {warnings} warning(s)")

          # Write to GitHub job summary
          with open("eu-ai-act-summary.md") as f:
              summary_md = f.read() if open("eu-ai-act-summary.md").read() else ""
          import os
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(summary_md)

          fail_on_warnings = "${{ github.event.inputs.fail_on_warnings }}" == "true"
          if errors > 0 or (fail_on_warnings and warnings > 0):
              print(f"::error::EU AI Act compliance check FAILED — {errors} error(s) found.")
              sys.exit(1)
          else:
              print("EU AI Act compliance check PASSED.")
          EOF

  # ── Diff-only fast check for PRs ──────────────────────────────────────
  eu-ai-act-diff-check:
    name: EU AI Act — Changed Files Only (Fast)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pyyaml

      - name: Get changed Python files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '\.py$' \
            | head -50 > changed_files.txt
          echo "files=$(cat changed_files.txt | wc -l)" >> $GITHUB_OUTPUT
          cat changed_files.txt

      - name: Scan changed files only
        if: steps.changed.outputs.files != '0'
        run: |
          while IFS= read -r file; do
            [ -f "$file" ] && aisg lint "$file" --errors-only --no-color || true
          done < changed_files.txt
